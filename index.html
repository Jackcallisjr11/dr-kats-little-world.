/* Prototype 14: upgraded, consistent hand-drawn 2D character styling.
   Keep original DOM, hitboxes, coordinates and movement logic unchanged. */
#player{width:48px;height:68px;filter:drop-shadow(0 2px 1px #355c3d22)}

#player .head:after{content:"";position:absolute;width:4px;height:3px;border-radius:50%;background:#49372f;left:6px;top:11px;box-shadow:8px 0 #49372f}

#player .hair:after{content:"";position:absolute;right:-10px;top:4px;width:8px;height:19px;border-radius:80% 15% 80% 25%;background:#332936;transform:rotate(-15deg)}
#player .body{position:relative;width:31px;height:28px;background:linear-gradient(90deg,#e8e6df,#fffefa 48%,#e9e7e0);border:1.7px solid #77766f;border-radius:8px 8px 6px 6px;margin-top:2px;box-shadow:inset 0 -3px 0 #e2dfd5}
#player .body:before{content:"✿";position:absolute;left:10px;top:5px;color:#9a9b8b;font-size:8px;line-height:1}
#player .body:after{content:"";position:absolute;left:4px;right:4px;top:4px;height:2px;border-radius:2px;background:#d6d4ca}
#player .legs{width:25px;height:15px;border:0;position:relative;margin-top:1px}
#player .legs:before,#player .legs:after{content:"";position:absolute;top:0;width:8px;height:14px;background:linear-gradient(90deg,#171a20,#30333a);border-radius:2px 2px 3px 3px}
#player .legs:before{left:3px}#player .legs:after{right:3px}

#jack{width:48px;height:70px;filter:drop-shadow(0 2px 1px #355c3d22)}

/* Prototype 15: final comfort and launch-preparation polish */

/* Prototype 20: gentle hand-drawn walk cycles for Kat and Jack.
   Animation is visual-only; movement coordinates, collision/interactions and save data stay intact. */
#player .body,#jack .jbody{transform-origin:50% 85%}
#player .legs:before,#jack .jlegs:before{transform-origin:50% 0}
#player .legs:after,#jack .jlegs:after{transform-origin:50% 0}
#player.walking .legs:before,#jack.walking .jlegs:before{animation:stepLeft .30s ease-in-out infinite alternate}
#player.walking .legs:after,#jack.walking .jlegs:after{animation:stepRight .30s ease-in-out infinite alternate}
#player.walking .body,#jack.walking .jbody{animation:walkBob .30s ease-in-out infinite alternate}
#player.walking .head,#jack.walking .jhead{animation:headBob .30s ease-in-out infinite alternate}
#player.walking .hair:before{animation-duration:.55s}
#player.facing-left,#jack.facing-left{transform:scaleX(-1)}
@keyframes stepLeft{from{transform:rotate(-20deg) translateY(-1px)}to{transform:rotate(22deg) translateY(1px)}}
@keyframes stepRight{from{transform:rotate(22deg) translateY(1px)}to{transform:rotate(-20deg) translateY(-1px)}}
@keyframes walkBob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes headBob{from{transform:translateY(0)}to{transform:translateY(-1px)}}
@media(prefers-reduced-motion:reduce){
 #player.walking .legs:before,#player.walking .legs:after,#jack.walking .jlegs:before,#jack.walking .jlegs:after,
 #player.walking .body,#jack.walking .jbody,#player.walking .head,#jack.walking .jhead{animation:none}
}

<script>
(()=>{
const world=document.getElementById('world'), player=document.getElementById('player'), stick=document.getElementById('stick');
const toast=document.getElementById('toast'), modal=document.getElementById('modal'), jack=document.getElementById('jack'), game=document.getElementById('game');
let x=580,y=390,jx=650,jy=390,dx=0,dy=0,coins=10,xp=0,watering=0,fish=0,butterflyFound=false,followButterfly=false,jackFollowing=true,mood='Happy',phase=0,dayPhase='Morning';
const SAVE_KEY='drKatLittleWorldSave_v1';
function loadGame(){
 try{
  const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d)return;
  if(Number.isFinite(d.x))x=d.x;if(Number.isFinite(d.y))y=d.y;
  if(Number.isFinite(d.jx))jx=d.jx;if(Number.isFinite(d.jy))jy=d.jy;
  if(Number.isFinite(d.coins))coins=d.coins;if(Number.isFinite(d.xp))xp=d.xp;
  if(Number.isFinite(d.watering))watering=d.watering;
  if(Number.isFinite(d.fish))fish=d.fish;
  butterflyFound=!!d.butterflyFound;
  mood=['Happy','Calm','Curious','Amused','Peaceful'].includes(d.mood)?d.mood:'Happy';
  phase=Number.isInteger(d.phase)?((d.phase%4)+4)%4:0;
  dayPhase=['Morning','Evening','Sunset','Night'][phase];
  if(Array.isArray(d.ownedItems))localStorage.setItem('katWorldItems',JSON.stringify(d.ownedItems));
  const b=document.getElementById('butterfly');if(butterflyFound&&b)b.style.opacity='.8';
 }catch(e){console.warn('Save data could not be loaded',e);}
}
function saveGame(){
 const data={version:1,x,y,jx,jy,coins,xp,watering,fish,butterflyFound,mood,phase,
  ownedItems:JSON.parse(localStorage.getItem('katWorldItems')||'[]'),
  playerName:localStorage.getItem('katWorldName')||'Dr. Kat',
  avatar:localStorage.getItem('katWorldAvatar')||'',
  sound:localStorage.getItem('katWorldSound')||'on',
  savedAt:new Date().toISOString()};
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));return true;}catch(e){return false;}
}
loadGame();

const objects=[
 {id:'garden',x:460,y:445,r:85,act:()=>{watering++;updateMood(mood);say(watering===1?'Dr. Kat waters the little plants. 🌱':'The garden looks fresher already! 🌼');if(watering%3===0)coins+=1;saveGame();}},
 {id:'river',x:830,y:545,r:85,act:()=>{fish++;saveGame();updateMood('Peaceful');say(fish%2?'You sit by the river and watch tiny ripples. 💧':'A tiny fish jumps! Riverside peace unlocked. 🐟');}},
 {id:'bench',x:640,y:680,r:75,act:()=>open('A quiet little break','Dr. Kat sits on the bench. The breeze moves through the trees. No tasks, no hurry. Just breathe. 🍃')},
 {id:'butterfly',x:310,y:365,r:95,act:()=>{if(!butterflyFound){butterflyFound=true;saveGame();followButterfly=true;updateMood('Curious');open('A tiny visitor','The butterfly flutters ahead, then waits. Follow whenever you feel like it — there is no timer. 🦋');}else{followButterfly=!followButterfly;say(followButterfly?'The butterfly is leading the way again. 🦋':'The butterfly pauses among the grass.');}}}
];
function moodIcon(){return mood==='Calm'?'😌':mood==='Curious'?'🦋':mood==='Amused'?'😄':mood==='Peaceful'?'🍃':'😊';}
function phaseIcon(){return dayPhase==='Evening'?'🌆':dayPhase==='Sunset'?'🌇':dayPhase==='Night'?'🌙':'☀️';}
function updateMood(next){mood=next;document.getElementById('moodbar').textContent=moodIcon()+' '+mood+' · '+phaseIcon()+' '+dayPhase;}
function changeTime(){phase=(phase+1)%4;dayPhase=['Morning','Evening','Sunset','Night'][phase];game.classList.remove('evening','sunset','night');if(dayPhase==='Evening')game.classList.add('evening');if(dayPhase==='Sunset')game.classList.add('sunset');if(dayPhase==='Night')game.classList.add('night');updateMood(mood);}
setInterval(changeTime,60000);
updateMood('Happy');
function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.remove('show'),2400);document.getElementById('coins').textContent='💌 '+coins;}
function updateWallet(){document.getElementById('coins').textContent='💌 '+coins;}
function open(title,msg){document.getElementById('mtitle').textContent=title;document.getElementById('mtext').textContent=msg;modal.classList.add('show');}
document.getElementById('close').onclick=()=>modal.classList.remove('show');
function showSavePanel(){
 const ok=saveGame();
 open('💾 Your little world is saved',ok?'Your island progress is saved on this device. Coins, position, garden visits, river moments, butterfly discovery, mood and profile details are kept here. 🌿':'Could not save right now. Please check your device storage.');
}
document.getElementById('saveBtn').addEventListener('click',showSavePanel);
window.addEventListener('pagehide',saveGame);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
setInterval(saveGame,5000);
const jackLines = {
 garden:["Dr. Kat: Jack! Andha plants-ku water oothuniya?","Jack: Ippo dhaan madam! Plant-ku water venum, swimming pool vendaam-nu theriyum!"],
 river:["Dr. Kat: Oru fish kooda pudikkalaya, Jack?","Jack: Fish ellam enna paathu escape aaguthu madam!"],
 bench:["Dr. Kat: Inga enna panra?","Jack: Unga island maintenance department. Salary mattum pending madam!"],
 forest:["Dr. Kat: Jack uh, nee thirumba inga vandhutiya?","Jack: Madam, unga island-ku naan permanent employee!"]
};
function jackTalk(){updateMood('Amused');
 const o=nearest();let key=o?.id==='garden'?'garden':o?.id==='river'?'river':o?.id==='bench'?'bench':'forest';
 const lines=jackLines[key];open("Jack says…",lines[0]+"\n\n"+lines[1]+"\n\n(Hehe! 😄)");
}
jack.addEventListener('click',e=>{e.stopPropagation();jackTalk();});
jack.addEventListener('pointerdown',e=>{e.stopPropagation();});

function nearest(){let best=null,dist=1e9;for(const o of objects){const d=Math.hypot(x-o.x,y-o.y);if(d<o.r&&d<dist){best=o;dist=d;}}return best;}
function interact(){const o=nearest();if(o)o.act();else if(Math.hypot(x-jx,y-jy)<95)jackTalk();else say('Konjam pakkathula poi interact pannunga, Dr. Kat! 🌿');}
document.getElementById('action').onclick=interact;
const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();interact();}});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={active:false,cx:0,cy:0};
const pad=document.getElementById('controls');
pad.addEventListener('pointerdown',e=>{joy.active=true;pad.setPointerCapture(e.pointerId);joy.cx=e.clientX;joy.cy=e.clientY;moveStick(e);});
pad.addEventListener('pointermove',e=>{if(joy.active)moveStick(e);});
function moveStick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let vx=e.clientX-cx,vy=e.clientY-cy,len=Math.hypot(vx,vy),m=32;if(len>m){vx=vx/len*m;vy=vy/len*m;}dx=vx/m;dy=vy/m;stick.style.transform=`translate(${vx}px,${vy}px)`;}
function release(){joy.active=false;dx=dy=0;stick.style.transform='translate(0,0)';}
pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
let moveVX=0,moveVY=0;
function frame(){let ax=dx,ay=dy;if(keys.w||keys.arrowup)ay=-1;if(keys.s||keys.arrowdown)ay=1;if(keys.a||keys.arrowleft)ax=-1;if(keys.d||keys.arrowright)ax=1;let l=Math.hypot(ax,ay);if(l>1){ax/=l;ay/=l;}
// Gentle acceleration and deceleration: quicker walking without jerky joystick starts/stops.
const targetVX=ax*3.15,targetVY=ay*3.15;
moveVX+=(targetVX-moveVX)*0.22;moveVY+=(targetVY-moveVY)*0.22;
if(Math.abs(moveVX)<0.025)moveVX=0;if(Math.abs(moveVY)<0.025)moveVY=0;
x+=moveVX;y+=moveVY;x=Math.max(25,Math.min(1175,x));y=Math.max(25,Math.min(850,y));player.style.left=(x-22)+'px';player.style.top=(y-55)+'px';
const katWalking=Math.hypot(moveVX,moveVY)>.18;
player.classList.toggle('walking',katWalking);
if(Math.abs(moveVX)>.08)player.classList.toggle('facing-left',moveVX<0);
if(jackFollowing){const targetX=x+48,targetY=y+8; jx+=(targetX-jx)*0.045; jy+=(targetY-jy)*0.045;}
jack.style.left=(jx-23)+'px';jack.style.top=(jy-58)+'px';
const jackWalking=jackFollowing&&Math.hypot((x+48)-jx,(y+8)-jy)>.7;
jack.classList.toggle('walking',jackWalking);
if(jackFollowing&&Math.abs(moveVX)>.08)jack.classList.toggle('facing-left',moveVX<0);
const scale=Math.min(Math.max(innerWidth/760,0.55),1);const tx=innerWidth/2-x*scale,ty=innerHeight/2-y*scale;world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
if(followButterfly){const b=document.getElementById('butterfly');const bx=parseFloat(b.style.left),by=parseFloat(b.style.top);if(Math.hypot(x-bx,y-by)<75){b.style.left=(bx+((Math.random()-.5)*100))+'px';b.style.top=(by+((Math.random()-.5)*90))+'px';if(Math.random()>.72){followButterfly=false;open('A little discovery','The butterfly rests near a hidden envelope. Inside: “Be still, and know that I am God.” — Psalm 46:10 💌');coins+=3;document.getElementById('coins').textContent='💌 '+coins;saveGame();}}}
requestAnimationFrame(frame);}


// Cumulative menu layer: profile, bag, settings and shop all share this working overlay.
const extraPanel=document.getElementById('extraPanel');
const extraTitle=document.getElementById('extraTitle');
const extraContent=document.getElementById('extraContent');

}

let profileName=localStorage.getItem('katWorldName')||'Dr. Kat';
let profilePhoto=localStorage.getItem('katWorldAvatar')||'';
let soundEnabled=localStorage.getItem('katWorldSound')!=='off';
let rainEnabled=localStorage.getItem('katWorldRain')==='on';
let firefliesEnabled=localStorage.getItem('katWorldFireflies')==='on';
const skyMoods=['morning','dawn','sunset','night'];
const skyLabels={morning:'☀️ Morning',dawn:'🌅 Dawn',sunset:'🌇 Sunset',night:'🌙 Night'};
let skyMood=localStorage.getItem('katWorldSkyMood')||'morning';
if(!skyMoods.includes(skyMood))skyMood='morning';
function applySkyMood(){
 skyMoods.forEach(m=>game.classList.toggle('sky-'+m,m===skyMood));
 const badge=document.getElementById('weatherBadge');
 if(badge)badge.textContent=skyLabels[skyMood]+' · '+(rainEnabled?'🌧️ Rain':'Clear');
 const mood=document.getElementById('moodbar');
 if(mood)mood.textContent='😊 Happy · '+skyLabels[skyMood];
 const btn=document.getElementById('skyMoodToggle');
 if(btn)btn.textContent='🌤️ Sky mood: '+skyLabels[skyMood];
}
function applyWeather(){
 game.classList.toggle('raining',rainEnabled);
 game.classList.toggle('fireflies',firefliesEnabled);
 const badge=document.getElementById('weatherBadge');
 if(badge)badge.textContent=(skyLabels[skyMood]||'☀️ Morning')+' · '+(rainEnabled?'🌧️ Rain':'Clear');
 applySkyMood();
}
applyWeather();

document.getElementById('profileBtn').addEventListener('click',()=>{
 const photo=profilePhoto?`<img id="profilePreview" src="${profilePhoto}" style="width:76px;height:76px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px">`:
 `<div style="font-size:42px;text-align:center">🌸</div>`;
 showExtra('👤 Player Profile',`${photo}
 <p>Display name</p><input id="profileNameInput" type="text" maxlength="24" value="${profileName.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" style="width:100%;padding:11px;border:1px solid #b7cfad;border-radius:10px">
 <p>Profile photo (optional)</p><input id="profilePhotoInput" type="file" accept="image/*" style="max-width:100%">
 <div class="stats"><div class="stat">⭐ Level<br><b>${Math.floor(xp/100)+1}</b></div><div class="stat">✨ XP<br><b>${xp}</b></div><div class="stat">💌 Coins<br><b>${coins}</b></div><div class="stat">🦋 Discovery<br><b>${butterflyFound?'Found':'Waiting'}</b></div></div>
 <button id="profileSave">Save profile</button>`);
});

document.getElementById('bagBtn').addEventListener('click',()=>{
 const owned=JSON.parse(localStorage.getItem('katWorldItems')||'[]');
 const names={warmmilk:'🥛 Warm Milk',honey:'🍯 Honey Jar',blanket:'🧺 Cozy Blanket',juice:'🧃 Fruit Juice',book:'📖 Little Book',shell:'🐚 River Shell'};
 const list=owned.length?owned.map(id=>`<div class="shopItem">${names[id]||id}</div>`).join(''):'<p>Your little bag is empty. Visit the shop whenever you like. 🌱</p>';
 showExtra('🎒 Little Bag',`<p>💌 Coins: <b>${coins}</b></p><div class="shopGrid">${list}</div><p>Garden visits: ${watering} · Riverside moments: ${fish}</p>`);
});

document.getElementById('settingsBtn').addEventListener('click',()=>{
 showExtra('⚙️ Settings',`<p><b>Island sky mood</b></p><button id="skyMoodToggle">🌤️ Sky mood: ${skyLabels[skyMood]}</button><p style="font-size:12px;color:#60765f">Choose a peaceful morning, dawn, sunset or night tint. It never changes your progress.</p>
 <p><b>Sound preference</b></p><button id="soundToggle">${soundEnabled?'🔊 Sound on':'🔇 Sound off'}</button>
 <p><b>Island weather</b></p><button id="weatherToggle">${rainEnabled?'🌧️ Soft rain on':'☀️ Clear skies'}</button><p style="font-size:12px;color:#60765f">A gentle rain effect. Switch it off whenever you like.</p>
 <p><b>Evening fireflies</b></p><button id="fireflyToggle">${firefliesEnabled?'✨ Fireflies on':'🌙 Fireflies off'}</button><p style="font-size:12px;color:#60765f">Tiny glowing lights drift around the island. No tasks, just atmosphere.</p>
 <p><b>Joystick size</b> <span id="joySizeLabel">100%</span></p><input id="joySize" type="range" min="80" max="125" value="${localStorage.getItem('katJoySize')||100}" style="width:100%">
 <p><b>Interact button size</b> <span id="actionSizeLabel">100%</span></p><input id="actionSize" type="range" min="80" max="125" value="${localStorage.getItem('katActionSize')||100}" style="width:100%">
 <p><b>Controls</b><br>Mobile: left joystick to move, INTERACT on the right.<br>Computer: WASD or arrow keys.</p>
 <p>Tip: rotate your phone to landscape for a wider view.</p>
 <button id="fullscreenToggle">⛶ Enter fullscreen</button>
 <div id="launchNote"><b>🌿 A little reminder</b><br>This island has no deadlines, no lost streaks and no wrong way to explore. Move at your own pace.</div>
 <p><b>💾 Move your island to another phone</b><br>Export a backup here, then import that file on the other device. This is a manual transfer, not automatic cloud sync.</p>
 <button id="exportSave">⬇️ Export island backup</button>
 <label for="importSaveFile" style="display:block;margin-top:10px;font-weight:700">📥 Import backup file</label>
 <input id="importSaveFile" type="file" accept="application/json,.json" style="display:block;width:100%;margin-top:6px">
 <div id="transferStatus" style="font-size:12px;color:#5e755f;margin-top:7px">Your backup stays in your control.</div>
 <button id="runChecks">🧪 Run game checks</button><div id="qaResults"></div>
 <div id="launchStatus">Save status: stored on this device when you save or make progress.</div>
 <p>Your progress is saved on this device. Clearing browser data may erase local saves.</p>`);
});

const shopCatalog=[
 {id:'warmmilk',name:'Warm Milk',emoji:'🥛',price:3,desc:'A cozy little drink'},
 {id:'honey',name:'Honey Jar',emoji:'🍯',price:4,desc:'A sweet island treat'},
 {id:'blanket',name:'Cozy Blanket',emoji:'🧺',price:6,desc:'For quiet breaks'},
 {id:'juice',name:'Fruit Juice',emoji:'🧃',price:5,desc:'A refreshing sip'},

];
function renderShop(){
 const owned=JSON.parse(localStorage.getItem('katWorldItems')||'[]');
 const cards=shopCatalog.map(it=>`<div class="shopItem"><div style="font-size:27px">${it.emoji}</div><b>${it.name}</b><br><small>${it.desc}</small><br><b>💌 ${it.price}</b><br><button data-shopbuy="${it.id}" ${owned.includes(it.id)?'disabled':''}>${owned.includes(it.id)?'Owned':'Buy'}</button></div>`).join('');
 showExtra('🛍️ Little Island Shop',`<p>Your coins: <b>💌 ${coins}</b></p><div class="shopGrid">${cards}</div><p>No pressure to buy anything. Just enjoy your island. 🌿</p>`);

function applyTouchSizes(){
 const j=Number(localStorage.getItem('katJoySize')||100),a=Number(localStorage.getItem('katActionSize')||100);
 const controls=document.getElementById('controls'),action=document.getElementById('action');
 controls.style.width=(116*j/100)+'px';controls.style.height=(116*j/100)+'px';
 action.style.width=(72*a/100)+'px';action.style.height=(72*a/100)+'px';
}
applyTouchSizes();



const KAT_TRANSFER_KEYS=['drKatLittleWorldSave_v1','katWorldItems','katWorldName','katWorldAvatar','katWorldSound','katJoySize','katActionSize'];
function exportIslandBackup(){
 saveGame();
 const payload={format:'dr-kat-little-world-backup',formatVersion:1,createdAt:new Date().toISOString(),data:{}};
 KAT_TRANSFER_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)payload.data[k]=v;});
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='dr-kat-island-backup.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1200);
 const s=document.getElementById('transferStatus');if(s)s.textContent='Backup exported. Keep the JSON file safe and import it on the other phone. 💚';
}
function importIslandBackup(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const payload=JSON.parse(String(reader.result||''));
   if(payload.format!=='dr-kat-little-world-backup'||payload.formatVersion!==1||!payload.data||typeof payload.data!=='object')throw new Error('This is not a supported island backup.');
   const allowed=Object.keys(payload.data).filter(k=>KAT_TRANSFER_KEYS.includes(k));
   if(!allowed.length)throw new Error('No compatible saved game data was found.');
   allowed.forEach(k=>{const v=payload.data[k];if(typeof v==='string')localStorage.setItem(k,v);});
   const s=document.getElementById('transferStatus');if(s)s.textContent='Backup imported. Reloading your island…';
   setTimeout(()=>location.reload(),700);
  }catch(err){
   const s=document.getElementById('transferStatus');if(s)s.textContent='Could not import: '+err.message;
  }
 };
 reader.onerror=()=>{const s=document.getElementById('transferStatus');if(s)s.textContent='Could not read that file. Please try again.';};
 reader.readAsText(file);
}

function runIntegrationChecks(){
 const checks=[
  ['Island game screen',!!document.getElementById('game')],
  ['Movement joystick',!!document.getElementById('controls')&&!!document.getElementById('stick')],
  ['Interact control',!!document.getElementById('action')],
  ['Profile / Bag / Save / Study / Shop', ['profileBtn','bagBtn','saveBtn','studyBtn','shopBtn'].every(id=>!!document.getElementById(id))],
  ['Settings and popup panel',!!document.getElementById('settingsBtn')&&!!document.getElementById('extraPanel')],
  ['Study question area',!!document.getElementById('studyBtn')&&typeof openStudy==='function'],
  ['Island audio controls',typeof startAmbient==='function'&&typeof stopAmbient==='function'],
  ['Mobile size preferences',typeof applyTouchSizes==='function'],
  ['Local save storage',(()=>{try{localStorage.setItem('__kat_test','ok');localStorage.removeItem('__kat_test');return true;}catch(e){return false;}})()]

// Prototype 11: optional procedural ambient audio; no external files or network requests.
let ambientCtx=null, ambientMaster=null, ambientNodes=[], ambientTimer=null, ambientOn=false;
function audioContext(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return null;
 if(!ambientCtx)ambientCtx=new AC();
 return ambientCtx;
}
function makeNoise(ctx){
 const length=ctx.sampleRate*2;
 const buffer=ctx.createBuffer(1,length,ctx.sampleRate);
 const data=buffer.getChannelData(0);
 let last=0;
 for(let i=0;i<length;i++){const white=Math.random()*2-1;last=(last+0.025*white)/1.025;data[i]=last*3.5;}
 const src=ctx.createBufferSource();src.buffer=buffer;src.loop=true;
 const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=520;
 const gain=ctx.createGain();gain.gain.value=0.018;
 src.connect(filter);filter.connect(gain);gain.connect(ambientMaster);src.start();
 ambientNodes.push(src,filter,gain);
}
function birdChirp(){
 if(!ambientOn||!ambientCtx||ambientCtx.state!=='running')return;
 const ctx=ambientCtx;
 const osc=ctx.createOscillator(), gain=ctx.createGain();
 const now=ctx.currentTime;
 const start=now+0.02;
 osc.type='sine';
 const f=dayPhase==='Night'?880:dayPhase==='Sunset'?1150:1450;
 osc.frequency.setValueAtTime(f,start);
 osc.frequency.exponentialRampToValueAtTime(f*1.28,start+0.09);
 osc.frequency.exponentialRampToValueAtTime(f*0.82,start+0.22);
 gain.gain.setValueAtTime(0.0001,start);
 gain.gain.exponentialRampToValueAtTime(0.022,start+0.035);
 gain.gain.exponentialRampToValueAtTime(0.0001,start+0.25);
 osc.connect(gain);gain.connect(ambientMaster);osc.start(start);osc.stop(start+0.27);
}
function startAmbient(){
 const ctx=audioContext();
 if(!ctx){document.getElementById('audioBadge').textContent='🔇 Audio unavailable';return;}
 if(ambientOn){if(ctx.state==='suspended')ctx.resume();return;}
 ambientOn=true;
 ctx.resume().then(()=>{
  if(!ambientOn)return;
  ambientMaster=ctx.createGain();ambientMaster.gain.value=0.62;ambientMaster.connect(ctx.destination);
  makeNoise(ctx);
  // Soft, low-volume nature tones. Bird calls are spaced out to keep the island calm.
  const bell=ctx.createOscillator(), bellGain=ctx.createGain();
  bell.type='sine';bell.frequency.value=196;
  bellGain.gain.value=0.0035;bell.connect(bellGain);bellGain.connect(ambientMaster);bell.start();
  ambientNodes.push(bell,bellGain);
  birdChirp();ambientTimer=setInterval(()=>{if(Math.random()>.25)birdChirp();},6500);
  document.getElementById('audioBadge').textContent='🎵 Island sounds on';
 }).catch(()=>{ambientOn=false;document.getElementById('audioBadge').textContent='🔇 Tap Sound to enable';});
}
function stopAmbient(){
 ambientOn=false;
 if(ambientTimer){clearInterval(ambientTimer);ambientTimer=null;}
 if(ambientCtx&&ambientMaster){
  try{ambientMaster.gain.setTargetAtTime(0,ambientCtx.currentTime,0.08);}catch(e){}
  setTimeout(()=>{ambientNodes.forEach(n=>{try{n.stop?.();n.disconnect?.();}catch(e){}});ambientNodes=[];try{ambientMaster.disconnect();}catch(e){}ambientMaster=null;},350);
 }
 document.getElementById('audioBadge').textContent='🎵 Island sounds off';
}
function syncAmbient(){if(soundEnabled)startAmbient();else stopAmbient();}

  document.getElementById('studyIntro').textContent=`"${raw}" noted! Indha subject-ku question set innum ready pannala. Konjam specific topic or subject name type pannunga; unrelated question kudukka maatten. 🌿`;

 }
